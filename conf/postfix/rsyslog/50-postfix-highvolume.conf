# High-volume Postfix logging – perfect for Billion Mail fork / bulk sending
# This file will be copied to /etc/rsyslog.d/50-postfix-highvolume.conf on the server

$CreateDirs on

# Create log directory if missing

# Separate log files by severity
template(name="MailInfo" type="string" string="/var/log/mail/info.log")
template(name="MailWarn" type="string" string="/var/log/mail/warn.log")
template(name="MailErr"  type="string" string="/var/log/mail/err.log")

# Catch everything from Postfix (postfix/smtpd, postfix/smtp, postfix/lmtp, etc.)
if $programname startswith "postfix" or $programname in ["smtpd", "smtp", "lmtp", "anvil", "cleanup", "qmgr"] then {
    if $syslogseverity <= 6 then {  # debug + info + notice
        action(type="omfile" dynaFile="MailInfo" flushInterval="10" ioBufferSize="256k")
        stop
    }
    if $syslogseverity == 4 then {
        action(type="omfile" dynaFile="MailWarn" flushInterval="5" ioBufferSize="128k")
    }
    if $syslogseverity <= 3 then {  # error + critical + alert + emergency
        action(type="omfile" dynaFile="MailErr" flushInterval="1" ioBufferSize="128k")
    }
}

# Fallback for Dovecot, Rspamd, etc.
mail.*   -/var/log/mail/all.log